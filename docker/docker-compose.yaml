services:
  postgres:
    image: postgres:16-alpine
    container_name: coffee-query-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coffee-query}
      POSTGRES_USER: ${POSTGRES_USER:-coffee-query}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - coffee-query-data:/var/lib/postgresql/data
      # Scripts .sql daqui rodam em ordem alfabética, só na primeira subida (volume vazio)
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  coffee-query-data:
